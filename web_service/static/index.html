<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HH AutoApply</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/style.css" rel="stylesheet">
  <style>
    /* Дополнительные стили SPA (светлая тема) */
    #app-navbar { min-height: 56px; background-color: #ffffff !important; border-bottom: 1px solid #e2e6ea; position: sticky; top: 0; z-index: 1030; }
    #app-footer { background-color: #f8f9fa; border-top: 1px solid #e2e6ea; color: #6b7280; font-size: 0.8rem; min-height: 48px; }
    #notifications-container { position: fixed; top: 70px; right: 24px; z-index: 2000; width: 360px; max-width: calc(100vw - 32px); }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .status-dot.online { background-color: #198754; box-shadow: 0 0 6px rgba(25,135,84,.5); }
    .status-dot.checking { background-color: #adb5bd; }
    .status-dot.offline { background-color: #ffc107; box-shadow: 0 0 6px rgba(255,193,7,.6); }
    .job-card { cursor: pointer; }
    .pulse-badge { animation: pulseBadge 1.2s ease-in-out infinite; }
    @keyframes pulseBadge { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .skeleton { background: linear-gradient(90deg, #eceff3 25%, #f6f8fa 50%, #eceff3 75%); background-size: 200% 100%; animation: skeletonPulse 1.4s infinite; border-radius: 8px; min-height: 140px; }
    @keyframes skeletonPulse { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .mode-card { cursor: pointer; border: 2px solid #dee2e6; transition: border-color .15s, background-color .15s; background-color: #fff; }
    .mode-card:hover { border-color: #b6d4fe; }
    .mode-card.selected { border-color: #0d6efd; background-color: #f0f6ff; }
    .heatmap-cell { width: 16px; height: 16px; margin: 2px; border-radius: 2px; display: inline-block; }
    .chart-box { position: relative; height: 260px; }
    @media (max-width: 768px) { .chart-box { height: 220px; } }
    .nav-link.active-route { color: #0d6efd !important; border-bottom: 2px solid #0d6efd; border-radius: 0; }
    .empty-state-icon { font-size: 64px; color: #adb5bd; }
    .stat-value { font-size: 32px; font-weight: 700; line-height: 1.1; color: #212529; }
    .stat-label { font-size: 14px; color: #6b7280; }
    .table-scroll-x { overflow-x: auto; }
    .text-secondary { color: #6b7280 !important; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

  <div id="notifications-container"></div>

  <nav class="navbar navbar-expand-lg navbar-light bg-white" id="app-navbar">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="#/login"><i class="bi bi-briefcase"></i> HH AutoApply</a>
    </div>
  </nav>

  <main id="app" class="container my-4 flex-grow-1">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Загрузка...</span></div>
      <p class="mt-2 text-secondary">Загрузка...</p>
    </div>
  </main>

  <footer class="footer py-2 mt-auto" id="app-footer">
    <div class="container d-flex flex-wrap justify-content-between align-items-center" style="min-height: 32px;">
      <span class="text-secondary">© 2026 HH AutoApply</span>
      <span id="footer-status-wrap">
        <span id="status-indicator"><span class="status-dot checking"></span></span><span id="footer-status" class="text-secondary">Проверка...</span>
      </span>
      <span class="text-secondary">Версия 1.0.0</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/assets/js/app.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
